# Os jogos no droplet compartilhado, no mesmo padrao que o hub ja usa: rede do
# host, servidor preso ao loopback e nenhuma porta publicada. Quem alcanca de
# fora e o cloudflared, que ja roda aqui e fala com 127.0.0.1.
services:
  games:
    build: .
    image: games:latest
    container_name: games
    restart: unless-stopped
    # Precisa ser host para o cloudflared achar o servico no loopback do droplet
    # (dentro de uma rede bridge, 127.0.0.1 seria o do proprio container).
    network_mode: host
    environment:
      PORT: 8090
      HOST: 127.0.0.1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
